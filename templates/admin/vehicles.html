<!-- ================================================= -->
<!-- MAIN CONTENT -->

<main class="main-content">


    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header class="topbar">

        <div>

            <h1>
                Vehicles
            </h1>

                Monitor all electric vehicles

        </div>


        <!-- ADMIN PROFILE -->

            <div class="profile-icon">

    <section class="date-filter-panel" aria-label="Vehicle list filters">

        <select id="vehicleDateRange">

        </select>

        <div class="custom-date-range" id="customVehicleDates" hidden>

        </div>

            <span>Company</span>

    <!-- ================================================= -->
    <!-- VEHICLE SECTION -->

                            Model

                            Driver

                        </th>

</main>



<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>


// =====================================================
// LOAD VEHICLES
// =====================================================

function formatVehicleDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function vehicleDateQuery() {
    const range = document.getElementById("vehicleDateRange").value;
    const today = new Date();
    let startDate = "";
    let endDate = "";
    if (range === "month") {
        startDate = formatVehicleDate(new Date(today.getFullYear(), today.getMonth(), 1));
        endDate = formatVehicleDate(today);
    } else if (range === "year") {
        startDate = `${today.getFullYear()}-01-01`;
        endDate = formatVehicleDate(today);
    } else if (range === "custom") {
        startDate = document.getElementById("vehicleStartDate").value;
        endDate = document.getElementById("vehicleEndDate").value;
    }
    if ((startDate && !endDate) || (!startDate && endDate)) {
        throw new Error("Select both a start date and an end date.");
    }
    if (startDate && endDate && startDate > endDate) {
        throw new Error("The start date must be before the end date.");
    }
    const params = new URLSearchParams();
    if (startDate) params.set("start_date", startDate);
    if (endDate) params.set("end_date", endDate);
    const query = params.toString();
    return query ? `?${query}` : "";
}

function updateVehicleCompanyOptions(vehicles) {
    const select = document.getElementById("vehicleCompanyFilter");
    const selectedCompany = select.value;
    const companies = [...new Set(vehicles.map(vehicle => vehicle.make))]
        .filter(Boolean)
        .sort((left, right) => String(left).localeCompare(String(right)));
    select.innerHTML = '<option value="">All Companies</option>';
    companies.forEach(company => {
        const option = document.createElement("option");
        option.value = company;
        option.textContent = company;
        select.appendChild(option);
    });
    select.value = companies.includes(selectedCompany) ? selectedCompany : "";
}

async function loadVehicles() {

    const tableBody =
        document.getElementById("vehiclesTableBody");


    try {

        // Show loading message

        tableBody.innerHTML = `

            <tr>

                <td colspan="7"
                    style="text-align:center;">

                    Loading vehicles...

                </td>

            </tr>

        `;


        // API REQUEST

        const response =
            await fetch("/api/vehicles" + vehicleDateQuery());


        // Check response

        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        // Convert response to JSON

        const vehicles =
            await response.json();
        updateVehicleCompanyOptions(vehicles);
        const selectedCompany = document.getElementById("vehicleCompanyFilter").value;
        const filteredVehicles = vehicles.filter(vehicle =>
            !selectedCompany || vehicle.make === selectedCompany
        );


        console.log(
            "Vehicles received:",
            vehicles
        );


        // Clear table

        tableBody.innerHTML = "";


        // =================================================
        // NO VEHICLES
        // =================================================

        if (!Array.isArray(filteredVehicles) ||
            filteredVehicles.length === 0) {

            tableBody.innerHTML = `

                <tr>

                    <td colspan="7"
                        style="text-align:center;">

                        No vehicles found

                    </td>

                </tr>

            `;

            return;

        }


        // =================================================
        // CREATE VEHICLE ROWS
        // =================================================

        filteredVehicles.forEach(vehicle => {


            const row =
                document.createElement("tr");


            // Vehicle number

            const vehicleNumber =
                vehicle.vehicle_number ?? "--";


            // Make

            const make =
                vehicle.make ?? "--";


            // Model

            const model =
                vehicle.model ?? "--";


            // Driver

            const driver =
                vehicle.driver_name ?? "Not Assigned";


            // Battery

            let battery =
                vehicle.battery_percentage;


            if (battery === null ||
                battery === undefined ||
                battery === "") {

                battery = "--";

            }
            else {

                battery =
                    Number(battery).toFixed(1) + "%";

            }


            // Location

            const location =
                vehicle.city ?? "--";


            // Status

            const status =
                vehicle.status ?? "--";


            // =================================================
            // STATUS CLASS
            // =================================================

            let statusClass =
                "status-normal";


            const statusLower =
                String(status).toLowerCase();


            if (statusLower === "running") {

                statusClass =
                    "status-running";

            }
            else if (
                statusLower === "charging"
            ) {

                statusClass =
                    "status-charging";

            }
            else if (
                statusLower === "maintenance" ||
                statusLower === "garage"
            ) {

                statusClass =
                    "status-warning";

            }
            else if (
                statusLower === "parked"
            ) {

                statusClass =
                    "status-parked";

            }


            // =================================================
            // CREATE HTML
            // =================================================

            row.innerHTML = `

                <td>

                    <strong>
                        ${vehicleNumber}
                    </strong>

                </td>


                <td>
                    ${make}
                </td>


                <td>
                    ${model}
                </td>


                <td>
                    ${driver}
                </td>


                <td>
                    ${battery}
                </td>


                <td>
                    📍 ${location}
                </td>


                <td>

                    <span class="${statusClass}">
                        ${status}
                    </span>

                </td>

            `;


            // Add row

            tableBody.appendChild(row);

        });


    }
    catch (error) {


        console.error(
            "Vehicle loading error:",
            error
        );


        // Show error on page

        tableBody.innerHTML = `

            <tr>

                <td colspan="7"
                    style="
                        text-align:center;
                        color:#ff6b6b;
                        padding:25px;
                    ">

                    Unable to load vehicle data.

                    <br>

                    <small>
                        Check the Flask API:
                        /api/vehicles
                    </small>

                </td>

            </tr>

        `;

    }

}



// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        document.getElementById("vehicleDateRange").addEventListener("change", event => {
            document.getElementById("customVehicleDates").hidden = event.target.value !== "custom";
        });
        document.getElementById("applyVehicleFilters").addEventListener("click", loadVehicles);
        document.getElementById("vehicleCompanyFilter").addEventListener("change", loadVehicles);

        loadVehicles();

    }
);

</script>
